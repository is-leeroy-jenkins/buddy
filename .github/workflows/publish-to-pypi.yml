name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade build twine
      - name: Check release version
        if: github.event_name == 'release'
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Release tag must match package version'
          PY
      - run: python -m build
      - run: python -m twine check dist/*
      - run: |
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python -c "import buddy; import buddy.cli"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/buddy-py/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
